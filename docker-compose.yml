  services:
    postgres:
      image: postgres:16
      container_name: jobtracker-db
      environment:
        POSTGRES_DB: jobtracker
        POSTGRES_USER: jobtracker
        POSTGRES_PASSWORD: secret
      ports:
        - "5432:5432"
      volumes:
        - jobtracker-data:/var/lib/postgresql/data

  volumes:
    jobtracker-data: