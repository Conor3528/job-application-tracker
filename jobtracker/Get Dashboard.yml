info:
  name: Get Dashboard
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:8080/api/dashboard/stats?Authorization=Bearer {{token}}
  params:
    - name: Authorization
      value: Bearer {{token}}
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
