info:
  name: Create Company
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/companies
  body:
    type: json
    data: |-
      {
        "name": "Stripe",
        "location": "Dublin",
        "industry": "Fintech",
        "website": "https://stripe.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
