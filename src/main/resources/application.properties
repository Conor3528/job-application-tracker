spring.application.name=jobtracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:jobtracker}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-stacktrace=never

jwt.secret=${JWT_SECRET:ThisIsMyDevelopmentSecretKeyForJwtSigningItNeedsToBeAtLeast256BitsLongForHS256}
jwt.expiration=${JWT_EXPIRATION:86400000}
